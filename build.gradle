buildscript {
    ext.kotlin_version = '1.3.61'
    repositories {
        mavenCentral()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
        maven {
            url "https://jcenter.bintray.com"
        }
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:kotlin-allopen:$kotlin_version"
        classpath 'gradle.plugin.de.fuerstenau:BuildConfigPlugin:1.1.8'
        classpath group: 'de.dynamicfiles.projects.gradle.plugins', name: 'javafx-gradle-plugin', version: '8.8.2'
    }
}

apply plugin: 'kotlin'
apply plugin: 'java'
apply plugin: "kotlin-allopen"
apply plugin: 'idea'
apply plugin: 'de.fuerstenau.buildconfig'
apply plugin: 'javafx-gradle-plugin'
//apply plugin: 'application'
group 'ru.lionzxy.tplauncher'
version '1.0-SNAPSHOT'

version = "1.2." + getTime()
sourceCompatibility = 1.8

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url 'https://jcenter.bintray.com/' }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
    kotlinOptions {
        jvmTarget = "1.8"
    }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.8.5'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    implementation 'com.github.LionZXY:mclauncher-api:37e0f29fc7'
    implementation "no.tornado:tornadofx:1.7.20"
    implementation 'de.codecentric.centerdevice:javafxsvg:1.3.0'
    implementation 'com.github.LionZXY:oslib:d5ba9facde'
    implementation "org.rauschig:jarchivelib:1.0.0"
    implementation "net.minidev:json-smart:1.1.1"
    implementation 'io.sentry:sentry:1.7.5'
    implementation "commons-codec:commons-codec:1.12"
    implementation 'org.zeroturnaround:zt-zip:1.14'
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.3.3")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-javafx:1.3.3")
    //implementation 'org.bitbucket.shemnon.javafxplugin:gradle-javafx-plugin:8.1.1'


    testCompile group: 'junit', name: 'junit', version: '4.12'
}

sourceSets {
    main.kotlin.srcDirs += 'src/main/kotlin'
    main.java.srcDirs += 'src/main/kotlin'
}

buildConfig {
    appName = project.name
    version = project.version

    clsName = 'BuildConfig'      // sets the name of the BuildConfig class
    packageName = project.group  // sets the package of the BuildConfig class,
    // 'de.fuerstenau.buildconfig' if project.group is not set
    charset = 'UTF-8'            // sets charset of the generated class,
}

// Wait https://github.com/FibreFoX/javafx-gradle-plugin/issues/147
jfx {
    mainClass 'ru.lionzxy.tplauncher.MainApplication'
}

// Run the launcher with Gradle 5.6.4 / Kotlin 1.3.61 (the toolchain this project is pinned to).
// GDK_BACKEND=x11 forces JavaFX/GTK onto X11/XWayland; without it JavaFX SIGSEGVs in libX11
// on a Wayland session. The fix travels with the task, so any `gradlew run` gets it.
task run(type: JavaExec) {
    group = 'application'
    description = 'Run TechnoparkLauncher (JavaFX) on JDK 8'
    main = 'ru.lionzxy.tplauncher.MainKt'
    classpath = sourceSets.main.runtimeClasspath
    environment 'GDK_BACKEND', 'x11'
}

// Headless login/launch flow for debugging. Credentials via -Pemail=.. -Ppassword=.. (set as env
// vars on the task so they reach the JVM regardless of the Gradle daemon's own environment).
// Add -Pcli='--no-launch' to stop after authentication.
task runCli(type: JavaExec) {
    group = 'application'
    description = 'Run the login/launch flow headless (CLI)'
    main = 'ru.lionzxy.tplauncher.MainCliKt'
    classpath = sourceSets.main.runtimeClasspath
    if (project.hasProperty('email')) {
        environment 'TPL_EMAIL', project.property('email')
    }
    if (project.hasProperty('password')) {
        environment 'TPL_PASSWORD', project.property('password')
    }
    if (project.hasProperty('cli')) {
        args(project.property('cli').toString().split(' '))
    }
    standardInput = System.in
}

task fatJar(type: Jar) {
    manifest {
        attributes 'Implementation-Title': 'launcher',
                'Implementation-Version': version,
                'Main-Class': 'ru.lionzxy.tplauncher.MainKt'
    }
    baseName = project.name
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    with jar
}

static def getTime() {
    return new Date().format('MMddHHmm')
}
